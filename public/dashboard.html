<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Kaminoa API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07070b;
  --bg3:     #14141d;
  --bg4:     #1b1b27;
  --border:  #20202e;
  --border2: #2a2a3d;
  --primary: #8b5cf6;
  --primary2:#ec4899;
  --grad:    linear-gradient(120deg,#8b5cf6,#ec4899);
  --text:    #e4e7f5;
  --muted:   #6b7194;
  --green:   #22c55e;
  --amber:   #f59e0b;
  --red:     #ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;position:relative}
body::before{content:"";position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 42% at 18% 12%, #8b5cf640 0%, transparent 60%),
    radial-gradient(34% 40% at 88% 8%,  #ec489933 0%, transparent 60%),
    radial-gradient(40% 46% at 78% 92%, #6366f133 0%, transparent 62%);
  filter:blur(36px)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%)}
header{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:0 18px;height:54px;background:rgba(10,10,16,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.logo-dot{width:9px;height:9px;background:var(--grad);border-radius:50%}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--border);background:var(--bg3);border-radius:9px;padding:7px 12px;transition:.14s}
.hbtn:hover{color:var(--text);border-color:var(--border2)}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:28px 18px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:rgba(12,12,18,.8);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;padding:22px}
.card h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:16px}
.profile{display:flex;align-items:center;gap:14px}
.profile img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--bg4);border:2px solid var(--border2)}
.pname{font-size:17px;font-weight:700}
.pemail{font-size:13px;color:var(--muted)}
.pexp{font-size:12px;color:#c4b5fd;margin-top:3px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-radius:100px;padding:3px 10px;margin-left:8px;vertical-align:2px}
.badge-free{background:#3b82f61f;border:1px solid #3b82f644;color:#60a5fa}
.badge-pro{background:linear-gradient(120deg,#8b5cf633,#ec489933);border:1px solid #8b5cf655;color:#c4b5fd}
.usage-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.usage-row b{font-family:'JetBrains Mono',monospace}
.bar{height:8px;background:var(--bg4);border-radius:100px;overflow:hidden}
.bar>div{height:100%;background:var(--grad);border-radius:100px;transition:width .4s}
.bar.warn>div{background:linear-gradient(120deg,#f59e0b,#ef4444)}
.reset-note{font-size:11.5px;color:var(--muted);margin-top:8px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:11px 13px;outline:none;min-width:0}
.keyrow input:focus{border-color:var(--primary)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--border2);background:var(--bg4);color:var(--text);border-radius:10px;padding:0 13px;cursor:pointer;transition:.14s;white-space:nowrap;font-family:inherit}
.ibtn:hover{border-color:var(--primary)}
.ibtn.danger:hover{border-color:var(--red);color:#f87171}
.key-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
.key-note code{background:var(--bg4);border:1px solid var(--border2);border-radius:5px;padding:1px 6px;font-size:11px;font-family:'JetBrains Mono',monospace}
.curl{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;background:#0a0a10;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:#a5b4fc;overflow-x:auto;white-space:pre}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--bg3)}
.plan.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.plan .pt{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.plan .pl{font-size:24px;font-weight:700;margin:10px 0 2px;font-family:'JetBrains Mono',monospace}
.plan .pu{font-size:11.5px;color:var(--muted)}
.plan .cur{font-size:10px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.6px}

/* ── Upgrade & pembayaran ── */
.upg{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.upg-info{flex:1;min-width:200px}
.upg-price{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace}
.upg-price small{font-size:12px;color:var(--muted);font-weight:500;font-family:'Inter',sans-serif}
.upg-desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.btn-pay{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:700;background:var(--grad);color:#fff;border:none;border-radius:11px;padding:12px 22px;cursor:pointer;transition:.15s;font-family:inherit;box-shadow:0 6px 20px #8b5cf640}
.btn-pay:hover{transform:translateY(-1px)}
.btn-pay:disabled{opacity:.6;cursor:not-allowed;transform:none}
.qr-wrap{text-align:center;padding-top:6px}
.qr-wrap img{width:230px;height:230px;border-radius:14px;border:1px solid var(--border2);background:#fff;padding:10px}
.qr-amount{font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace;margin:12px 0 4px}
.qr-status{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;border-radius:100px;padding:6px 14px;margin-top:6px}
.qr-status.pending{background:#f59e0b1a;border:1px solid #f59e0b44;color:#fbbf24}
.qr-status.success{background:#22c55e1a;border:1px solid #22c55e44;color:#4ade80}
.qr-status.expired{background:#ef44441a;border:1px solid #ef444444;color:#f87171}
.qr-alt{font-size:12px;color:var(--muted);margin-top:10px}
.qr-alt a{color:#a78bfa;text-decoration:none}
.qr-dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg4);border:1px solid var(--border2);color:var(--text);font-size:13px;font-weight:600;border-radius:10px;padding:10px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <a class="logo" href="/"><div class="logo-dot"></div>Kaminoa API</a>
  <div class="hdr-right">
    <a class="hbtn" href="/docs">← Docs</a>
    <a class="hbtn" href="/auth/logout">Logout</a>
  </div>
</header>

<main id="main"><div class="spin"></div></main>
<div class="toast" id="toast"></div>

<script>
const main = document.getElementById('main')
const toastEl = document.getElementById('toast')
let me = null, payCfg = { enabled: false }, plansCfg = {}
let pollTimer = null

function toast(msg) {
  toastEl.textContent = msg
  toastEl.classList.add('show')
  setTimeout(() => toastEl.classList.remove('show'), 2200)
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}
const fmt = n => Number(n).toLocaleString('id-ID')
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })
}

async function load() {
  const r = await fetch('/auth/me')
  if (!r.ok) return location.href = '/login?next=' + encodeURIComponent('/dashboard')
  const d = await r.json()
  me = d.user
  plansCfg = d.plans || {}
  payCfg = d.payment || { enabled: false }
  if (me.isAdmin && !document.getElementById('admin-link')) {
    const a = document.createElement('a')
    a.className = 'hbtn'; a.id = 'admin-link'; a.href = '/admin'; a.textContent = 'Admin'
    document.querySelector('.hdr-right').prepend(a)
  }
  render()
}

function render() {
  const u = me
  const pct = u.usage.limit ? Math.min(100, Math.round(u.usage.used / u.usage.limit * 100)) : 0
  const warn = pct >= 80 ? 'warn' : ''
  const avatar = u.avatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238b5cf6"><circle cx="12" cy="12" r="12"/><text x="12" y="16" font-size="10" text-anchor="middle" fill="%23fff" font-family="sans-serif">' + esc((u.name || 'U')[0].toUpperCase()) + '</text></svg>')
  const expTxt = u.plan !== 'free'
    ? (u.planExpiresAt ? 'Pro aktif sampai ' + fmtDate(u.planExpiresAt) : 'Pro aktif tanpa batas waktu')
    : ''

  const planCards = Object.entries(plansCfg).map(([key, p]) => `
    <div class="plan ${key === u.plan ? 'active' : ''}">
      <div class="pt">${esc(p.label || key)} ${key === u.plan ? '<span class="cur">Plan kamu</span>' : ''}</div>
      <div class="pl">${fmt(p.dailyLimit)}</div>
      <div class="pu">request / hari</div>
    </div>`).join('')

  // Kartu upgrade: cuma untuk free & payment aktif
  const upgCard = (u.plan === 'free' && payCfg.enabled) ? `
    <div class="card">
      <h2>Upgrade ke Pro</h2>
      <div id="upg-body">
        <div class="upg">
          <div class="upg-info">
            <div class="upg-price">Rp${fmt(payCfg.price || 10000)}<small> / ${payCfg.durationDays || 30} hari</small></div>
            <div class="upg-desc">Kuota naik jadi ${fmt(plansCfg.pro?.dailyLimit || 20000)} request/hari. Bayar sekali via QRIS (GoPay, OVO, DANA, ShopeePay, m-banking, dll), plan aktif otomatis setelah lunas.</div>
          </div>
          <button class="btn-pay" id="btn-pay" onclick="createPay()">Bayar via QRIS</button>
        </div>
      </div>
    </div>` : ''

  main.innerHTML = `
    <div class="card">
      <h2>Profil</h2>
      <div class="profile">
        <img src="${avatar}" alt="" referrerpolicy="no-referrer">
        <div>
          <div class="pname">${esc(u.name)}<span class="badge badge-${esc(u.plan)}">${esc(u.planLabel)}</span></div>
          <div class="pemail">${esc(u.email || '')}</div>
          ${expTxt ? `<div class="pexp">${esc(expTxt)}</div>` : ''}
        </div>
      </div>
    </div>

    ${upgCard}

    <div class="card">
      <h2>Pemakaian Hari Ini</h2>
      <div class="usage-row"><span>Terpakai</span><b>${fmt(u.usage.used)} / ${fmt(u.usage.limit)}</b></div>
      <div class="bar ${warn}"><div style="width:${pct}%"></div></div>
      <div class="reset-note">Kuota reset otomatis tiap jam 00:00.</div>
    </div>

    <div class="card">
      <h2>API Key Kamu</h2>
      <div class="keyrow">
        <input id="key" type="password" value="${esc(u.apiKey)}" readonly>
        <button class="ibtn" onclick="toggleKey()" id="eye">Lihat</button>
        <button class="ibtn" onclick="copyKey()">Salin</button>
        <button class="ibtn danger" onclick="regen()">Generate Ulang</button>
      </div>
      <div class="key-note">
        Kirim di setiap request lewat header <code>x-api-key</code>. Jangan bagikan key ini ke siapa pun.
        <div class="curl">curl "${location.origin}/endpoint" \\
  -H "x-api-key: ${esc(u.apiKey)}"</div>
      </div>
    </div>

    <div class="card">
      <h2>Plan</h2>
      <div class="plans">${planCards}</div>
    </div>`
}

// ── Pembayaran ──
async function createPay() {
  const btn = document.getElementById('btn-pay')
  if (btn) { btn.disabled = true; btn.textContent = 'Membuat tagihan...' }
  try {
    const r = await fetch('/pay/create', { method: 'POST' })
    const d = await r.json()
    if (!d.ok) {
      toast(d.error || 'Gagal membuat tagihan')
      if (btn) { btn.disabled = false; btn.textContent = 'Bayar via QRIS' }
      return
    }
    showQr(d)
    startPoll(d.refNo)
  } catch {
    toast('Koneksi gagal, coba lagi')
    if (btn) { btn.disabled = false; btn.textContent = 'Bayar via QRIS' }
  }
}

function showQr(d) {
  document.getElementById('upg-body').innerHTML = `
    <div class="qr-wrap">
      <div class="qr-amount">Rp${fmt(d.amount)}</div>
      <div class="upg-desc" style="margin-bottom:10px">Scan pakai aplikasi pembayaran apa saja (QRIS)</div>
      ${d.qrUrl ? `<img src="${esc(d.qrUrl)}" alt="QRIS">` : ''}
      <div><span class="qr-status pending" id="qr-status"><span class="qr-dot"></span>Menunggu pembayaran...</span></div>
      ${d.paymentLink ? `<div class="qr-alt">atau <a href="${esc(d.paymentLink)}" target="_blank" rel="noopener">bayar lewat halaman MustikaPay →</a></div>` : ''}
    </div>`
}

function startPoll(refNo) {
  clearInterval(pollTimer)
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch('/pay/status/' + encodeURIComponent(refNo))
      const d = await r.json()
      if (!d.ok) return
      const el = document.getElementById('qr-status')
      if (d.status === 'success') {
        clearInterval(pollTimer)
        if (el) { el.className = 'qr-status success'; el.innerHTML = '✓ Pembayaran berhasil — kamu sekarang Pro!' }
        toast('Selamat, plan Pro aktif!')
        setTimeout(load, 1800)
      } else if (d.status === 'expired') {
        clearInterval(pollTimer)
        if (el) { el.className = 'qr-status expired'; el.textContent = 'QR kedaluwarsa' }
        setTimeout(load, 2500)
      }
    } catch { /* abaikan, coba lagi */ }
  }, 4000)
}

function toggleKey() {
  const i = document.getElementById('key')
  const show = i.type === 'password'
  i.type = show ? 'text' : 'password'
  document.getElementById('eye').textContent = show ? 'Sembunyi' : 'Lihat'
}

async function copyKey() {
  try {
    await navigator.clipboard.writeText(me.apiKey)
    toast('API key tersalin')
  } catch {
    const i = document.getElementById('key')
    i.type = 'text'; i.select()
    document.execCommand('copy')
    toast('API key tersalin')
  }
}

async function regen() {
  if (!confirm('Generate API key baru? Key lama langsung tidak bisa dipakai.')) return
  const r = await fetch('/auth/apikey/regenerate', { method: 'POST' })
  const d = await r.json()
  if (!d.ok) return toast('Gagal generate key')
  me.apiKey = d.apiKey
  load().then(() => toast('API key baru dibuat'))
}

load()
</script>

</body>
</html>
