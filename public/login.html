<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Kaminoa API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07070b;
  --bg3:     #14141d;
  --bg4:     #1b1b27;
  --border:  #20202e;
  --border2: #2a2a3d;
  --primary: #8b5cf6;
  --primary2:#ec4899;
  --pri-dim: #8b5cf61f;
  --grad:    linear-gradient(120deg,#8b5cf6,#ec4899);
  --text:    #e4e7f5;
  --muted:   #6b7194;
  --red:     #ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 42% at 18% 12%, #8b5cf640 0%, transparent 60%),
    radial-gradient(34% 40% at 88% 8%,  #ec489933 0%, transparent 60%),
    radial-gradient(40% 46% at 78% 92%, #6366f133 0%, transparent 62%);
  filter:blur(36px);animation:drift 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(2%,-2%,0) scale(1.06)}100%{transform:translate3d(-2%,2%,0) scale(1.02)}}
.card{position:relative;z-index:1;width:100%;max-width:380px;background:rgba(12,12,18,.8);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--border);border-radius:18px;padding:34px 30px;text-align:center;box-shadow:0 20px 60px #00000055}
.logo{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.logo-dot{width:9px;height:9px;background:var(--grad);border-radius:50%;box-shadow:0 0 0 0 #8b5cf6aa;animation:pulse 2.4s ease-out infinite;flex-shrink:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 #8b5cf680}70%{box-shadow:0 0 0 7px #8b5cf600}100%{box-shadow:0 0 0 0 #8b5cf600}}
.sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.err{background:#ef44441a;border:1px solid #ef444433;color:#f87171;font-size:12px;border-radius:9px;padding:9px 12px;margin-bottom:16px;line-height:1.5}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--border2);transition:transform .14s,box-shadow .14s,border-color .14s;line-height:1}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{flex-shrink:0}
.btn-google{background:#fff;color:#1f1f1f;border-color:#fff}
.btn-google:hover{box-shadow:0 6px 20px #ffffff22}
.btn-github{background:var(--bg4);color:var(--text)}
.btn-github:hover{border-color:var(--primary);box-shadow:0 6px 20px #8b5cf622}
.note{font-size:12px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:10px 12px;line-height:1.5}
.foot{margin-top:20px;font-size:11.5px;color:var(--muted);line-height:1.6}
.foot code{background:var(--bg4);border:1px solid var(--border2);border-radius:5px;padding:1px 6px;font-size:11px}
.spin{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:sp 0.7s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
  <div class="logo"><div class="logo-dot"></div>Kaminoa API</div>
  <p class="sub">Login dulu untuk mengakses dokumentasi<br>& playground API.</p>
  <div class="err" id="err" style="display:none"></div>
  <div class="btns" id="btns"><div class="spin"></div></div>
  <div class="note" id="note" style="display:none;margin-top:4px">Login belum dikonfigurasi oleh admin.<br>Coba lagi nanti.</div>
  <p class="foot">Setelah login kamu dapat API key pribadi di dashboard.<br>Semua request API wajib pakai header <code>x-api-key</code>.</p>
</div>

<script>
const params = new URLSearchParams(location.search)
const next = params.get('next') || '/'
const errBox = document.getElementById('err')
const btns = document.getElementById('btns')

if (params.get('error') === 'denied') {
  errBox.textContent = 'Akun kamu tidak diizinkan mengakses server ini. Hubungi admin.'
  errBox.style.display = 'block'
} else if (params.get('error')) {
  errBox.textContent = 'Login gagal. Coba lagi.'
  errBox.style.display = 'block'
}

const ICONS = {
  google: '<svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>',
  github: '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11.04 11.04 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.67.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>'
}
const LABELS = { google: 'Lanjutkan dengan Google', github: 'Lanjutkan dengan GitHub' }

fetch('/auth/providers').then(r => r.json()).then(d => {
  btns.innerHTML = ''
  if (!d.providers?.length) {
    document.getElementById('note').style.display = 'block'
    return
  }
  for (const p of d.providers) {
    const a = document.createElement('a')
    a.className = 'btn btn-' + p
    a.href = '/auth/' + p + '?next=' + encodeURIComponent(next)
    a.innerHTML = ICONS[p] + '<span>' + LABELS[p] + '</span>'
    btns.appendChild(a)
  }
}).catch(() => {
  btns.innerHTML = ''
  document.getElementById('note').style.display = 'block'
})
</script>

</body>
</html>
